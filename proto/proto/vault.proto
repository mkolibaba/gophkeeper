edition = "2023";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package gophkeeper;

message Binary {
    string filename = 1;
    int64 size = 2;
}

message Card {
    string number = 1;
    string exp_date = 2;
    string cvv = 3;
    string cardholder = 4;
}

message Login {
    string login = 1;
    string password = 2;
    string website = 3;
}

message Note {
    string text = 1;
}

message Item {
    string id = 1;
    string name = 2;
    string notes = 3;
    google.protobuf.Timestamp updated_at = 4;

    oneof data {
        Binary binary = 10;
        Card card = 11;
        Login login = 12;
        Note note = 13;
    }
}

message Vault {
    repeated Item items = 1;
}

message CreateItemRequest {
    string name = 1;
    string notes = 2;

    oneof data {
        Binary binary = 10;
        Card card = 11;
        Login login = 12;
        Note note = 13;
    }
}

message UpdateItemRequest {
    string id = 1;
    string name = 2;
    string notes = 3;

    oneof data {
        Binary binary = 10;
        Card card = 11;
        Login login = 12;
        Note note = 13;
    }
}

message DeleteItemRequest {
    string id = 1;
}

service VaultService {
    rpc Get(google.protobuf.Empty) returns (Vault);
    rpc CreateItem(CreateItemRequest) returns (Item);
    rpc UpdateItem(UpdateItemRequest) returns (Item);
    rpc DeleteItem(DeleteItemRequest) returns (google.protobuf.Empty);
}

// обмен бинарными данными ведется через google/bytestream/bytestream.proto
