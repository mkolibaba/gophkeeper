version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go/gophkeeperv1
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go/gophkeeperv1
    opt: paths=source_relative
inputs:
  - directory: proto
managed:
  enabled: true
  override:
    - file_option: go_package
      value: /gophkeeperv1
